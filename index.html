<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-i18n="pageTitle"></title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="translations.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --text-color: var(--tg-theme-text-color, #111827);
      --hint-color: var(--tg-theme-hint-color, #6b7280);
      --link-color: var(--tg-theme-link-color, #2481cc);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: rgba(128, 128, 128, 0.22);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 48px;
      line-height: 1.45;
      font-size: 15px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }

    .lang-switcher {
      display: inline-flex;
      background-color: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 2px;
      flex-shrink: 0;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--hint-color);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .lang-btn.active {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    .header p {
      font-size: 14px;
      color: var(--hint-color);
    }

    .header p a {
      color: var(--link-color);
      text-decoration: underline;
    }

    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 12px;
      background-color: var(--secondary-bg);
      border-radius: 8px;
      font-size: 13px;
      color: var(--hint-color);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--hint-color);
      margin: 24px 0 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .required {
      color: var(--danger-color);
    }

    input[type="text"],
    input[type="url"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--button-color);
    }

    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > .form-group {
      flex: 1;
    }

    .session-card {
      background-color: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      position: relative;
    }

    .session-card input {
      background-color: var(--bg-color);
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--hint-color);
    }

    .remove-session-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-session-btn {
      width: 100%;
      padding: 10px;
      border: 1px dashed var(--button-color);
      border-radius: 10px;
      background: transparent;
      color: var(--button-color);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      font-weight: 400;
    }

    .checkbox-row:has(input:disabled) {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .checkbox-row input[type="checkbox"],
    .checkbox-row input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--button-color);
      cursor: pointer;
    }

    .hint {
      font-size: 12px;
      color: var(--hint-color);
      margin-top: 5px;
    }

    .map-status {
      display: inline-block;
      font-size: 12px;
      color: var(--success-color);
      margin-top: 4px;
      font-weight: 500;
    }

    .pac-container {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-top: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      font-family: inherit;
      z-index: 9999;
    }
    .pac-item {
      padding: 8px 12px;
      color: var(--text-color);
      border-top: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 13px;
    }
    .pac-item:hover {
      background-color: var(--secondary-bg);
    }
    .pac-item-query {
      color: var(--text-color);
      font-size: 14px;
    }

    .file-upload {
      position: relative;
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      background-color: var(--secondary-bg);
      cursor: pointer;
    }

    .file-upload input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload-text {
      font-size: 13px;
      color: var(--hint-color);
    }

    .file-upload-text strong {
      color: var(--button-color);
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .preview-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .preview-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: var(--secondary-bg);
      border-radius: 8px;
      font-size: 13px;
    }

    .preview-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 75%;
    }

    .remove-file {
      color: var(--danger-color);
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
    }

    .post-preview-box {
      background-color: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      font-size: 13.5px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      transition: border-color 0.2s;
    }

    .post-preview-box.over-limit {
      border-color: var(--danger-color);
    }

    .post-preview-box a {
      color: var(--link-color);
      text-decoration: underline;
    }

    .char-counter {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 12.5px;
      color: var(--hint-color);
      margin-top: 8px;
    }

    .char-counter.over-limit {
      color: var(--danger-color);
      font-weight: 600;
    }

    .limit-alert {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: var(--danger-color);
      font-size: 13px;
      font-weight: 500;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background-color: var(--button-color);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 48px 16px;
    }

    .success-icon {
      font-size: 52px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div id="formContainer">
    <div class="header">
      <div class="header-top">
        <h1 data-i18n="headerTitle"></h1>
        <div class="lang-switcher" id="langSwitcher"></div>
      </div>
      <p id="headerSubtitle"></p>
      <div class="user-badge" id="userBadge">👤 ...</div>
    </div>

    <form id="eventForm">
      <!-- БЛОК 1: ОСНОВНОЕ, ДАТЫ И БИЛЕТЫ -->
      <div class="section-title" data-i18n="sec1Title"></div>

      <div class="form-group">
        <label><span data-i18n="titleLabel"></span> <span class="required">*</span></label>
        <input type="text" id="title" data-i18n-placeholder="titlePlaceholder" required>
      </div>

      <label><span data-i18n="sessionsLabel"></span> <span class="required">*</span></label>
      <div id="sessionsContainer"></div>
      <button type="button" class="add-session-btn" id="addSessionBtn" data-i18n="addSessionBtn"></button>

      <div class="form-group">
        <label><span data-i18n="entryLabel"></span> <span class="required">*</span></label>
        <div class="radio-group">
          <label class="checkbox-row">
            <input type="radio" name="entryType" value="free">
            <span data-i18n="entryFree"></span>
          </label>
          <label class="checkbox-row">
            <input type="radio" name="entryType" value="donation">
            <span data-i18n="entryDonation"></span>
          </label>
          <label class="checkbox-row">
            <input type="radio" name="entryType" value="ticket" checked>
            <span data-i18n="entryTicket"></span>
          </label>
        </div>
        <input type="text" id="price" required>
      </div>

      <div class="form-group">
        <label data-i18n="sellerLabel"></label>
        <label class="checkbox-row">
          <input type="checkbox" id="atDoor">
          <span data-i18n="atDoorLabel"></span>
        </label>
        <input type="text" id="ticketSeller" data-i18n-placeholder="sellerPlaceholder">
      </div>

      <div class="form-group">
        <label data-i18n="ticketUrlLabel"></label>
        <input type="url" id="ticketUrl" placeholder="https://fienta.com/...">
      </div>

      <!-- БЛОК 2: МЕСТО ПРОВЕДЕНИЯ -->
      <div class="section-title" data-i18n="sec2Title"></div>

      <div class="form-group">
        <label><span data-i18n="venueNameLabel"></span> <span class="required">*</span></label>
        <input type="text" id="venueName" data-i18n-placeholder="venueNamePlaceholder" required>
        </div>

      <div class="form-group">
        <label data-i18n="venueUrlLabel"></label>
        <input type="url" id="venueUrl" placeholder="https://...">
      </div>

      <div class="form-group">
        <label><span data-i18n="addressLabel"></span> <span class="required">*</span></label>
        <input type="text" id="address" data-i18n-placeholder="addressPlaceholder" autocomplete="off" required>
        <div class="map-status" id="mapStatus" data-i18n="mapStatusSelected" style="display: none;"></div>
        <div class="hint" data-i18n="addressHint"></div>
      </div>

      <div class="form-group">
        <label data-i18n="mapUrlLabel"></label>
        <input type="url" id="mapUrl" data-i18n-placeholder="mapUrlPlaceholder">
      </div>

      <!-- БЛОК 3: ОПИСАНИЕ И СОЦСЕТИ -->
      <div class="section-title" data-i18n="sec3Title"></div>

      <div class="row">
        <div class="form-group" style="flex: 1;">
          <label data-i18n="linkTypeLabel"></label>
          <select id="eventLinkType">
            <option value="✦ Facebook event">✦ Facebook event</option>
            <option value="✦ Instagram post">✦ Instagram post</option>
            <option value="✦ Сайт мероприятия" data-i18n="linkTypeSite"></option>
            <option value="✦ Регистрация" data-i18n="linkTypeReg"></option>
          </select>
        </div>
        <div class="form-group" style="flex: 1.6;">
          <label data-i18n="eventUrlLabel"></label>
          <input type="url" id="eventUrl" placeholder="https://www.facebook.com/events/...">
        </div>
      </div>

      <div class="form-group">
        <label><span data-i18n="descLabel"></span> <span class="required">*</span></label>
        <textarea id="description" data-i18n-placeholder="descPlaceholder" required></textarea>
        <div class="hint" data-i18n="descHint"></div>
      </div>

      <!-- БЛОК 4: АФИША И КОММЕНТАРИЙ -->
      <div class="section-title" data-i18n="sec4Title"></div>

      <div class="form-group">
        <label data-i18n="posterLabel"></label>
        <div class="file-upload">
          <input type="file" id="mediaInput" accept="image/*">
          <div class="file-upload-text">
            <strong data-i18n="uploadStrong"></strong>
            <span data-i18n="uploadHint"></span>
          </div>
        </div>
        <div class="preview-list" id="previewList"></div>
      </div>

      <div class="form-group">
        <label data-i18n="noteLabel"></label>
        <input type="text" id="moderatorNote" data-i18n-placeholder="notePlaceholder">
      </div>

      <!-- ПРЕДПРОСМОТР ПОСТА -->
      <div class="section-title" data-i18n="previewSectionTitle"></div>
      <div class="post-preview-box" id="livePreview"></div>
      <div class="char-counter" id="charCounter">
        <span id="charCountText"></span>
        <span data-i18n="charMaxHint"></span>
      </div>
      <div class="limit-alert" id="limitAlert"></div>

      <label class="checkbox-row" style="margin-top: 16px; align-items: flex-start;">
        <input type="checkbox" id="notifyConsent" checked style="margin-top: 2px; flex-shrink: 0;">
        <span data-i18n="notifyCheckboxLabel" style="font-size: 13.5px; line-height: 1.4;"></span>
      </label>

<button type="submit" class="submit-btn" id="submitBtn" data-i18n="submitBtn"></button>
      
      <button type="submit" class="submit-btn" id="submitBtn" data-i18n="submitBtn"></button>
    </form>
  </div>

  <!-- ЭКРАН УСПЕШНОЙ ОТПРАВКИ -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">✅</div>
    <h2 data-i18n="successTitle"></h2>
    <p style="color: var(--hint-color); margin-top: 10px;" data-i18n="successText"></p>
    <p id="notifyStatusText" style="font-size: 13.5px; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background-color: var(--secondary-bg);"></p>
    <a id="openBotLink" href="https://t.me/romanivanovevents_bot?start=notify" target="_blank" class="submit-btn" style="display: none; text-decoration: none; margin-top: 14px;" data-i18n="openBotBtn"></a>
    <button class="submit-btn" style="margin-top: 12px;" onclick="closeApp()" data-i18n="closeBtn"></button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // =========================================================
    // НАСТРОЙКИ
    // =========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySqviSBOlMPSlzF8N6Pra9Q1cQeI1TzFoRALCbNMHACICjjnRAVQoDNRJIIfPe8gWE/exec";
    const GOOGLE_MAPS_API_KEY = "AIzaSyArIrLC_kWYtfscg-_PI-pjsAWe2Uf2RhI";

    // =========================================================
    // СИСТЕМА ПЕРЕВОДОВ (TRANSLATIONS.JS)
    // =========================================================
    const availableLangs = Object.keys(TRANSLATIONS);
    let currentLang = detectInitialLanguage();

    function detectInitialLanguage() {
      const saved = localStorage.getItem('app_lang');
      if (saved && TRANSLATIONS[saved]) return saved;

      const tgLang = (tg.initDataUnsafe?.user?.language_code || '').toLowerCase().slice(0, 2);
      if (tgLang && TRANSLATIONS[tgLang]) return tgLang;

      return availableLangs[0] || 'ru';
    }

    function getDict() {
      return TRANSLATIONS[currentLang] || TRANSLATIONS[availableLangs[0]];
    }

    function t(key, vars = {}) {
      const dict = getDict();
      const fallback = TRANSLATIONS[availableLangs[0]] || {};
      let str = dict[key] !== undefined ? dict[key] : (fallback[key] !== undefined ? fallback[key] : key);
      if (typeof str === 'string') {
        Object.keys(vars).forEach(k => {
          str = str.replace(new RegExp(`\\{${k}\\}`, 'g'), vars[k]);
        });
      }
      return str;
    }

    function renderLangSwitcher() {
      const switcher = document.getElementById('langSwitcher');
      switcher.innerHTML = '';
      availableLangs.forEach(code => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lang-btn' + (code === currentLang ? ' active' : '');
        btn.textContent = TRANSLATIONS[code].langName || code.toUpperCase();
        btn.addEventListener('click', () => setLanguage(code));
        switcher.appendChild(btn);
      });
    }

    function setLanguage(lang) {
      if (!TRANSLATIONS[lang]) return;
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      document.documentElement.lang = lang;

      renderLangSwitcher();

      document.getElementById('headerSubtitle').innerHTML = t('headerSubtitle');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        el.placeholder = t(key);
      });

      updateUserBadge();
      applyEntryTypeState();
      renderFileList();
      updatePreview();
    }

    // Инициализация пользователя Telegram
    const tgUser = tg.initDataUnsafe?.user;
    function updateUserBadge() {
      const userBadge = document.getElementById('userBadge');
      if (tgUser) {
        const displayName = tgUser.username ? `@${tgUser.username}` : `${tgUser.first_name} (ID: ${tgUser.id})`;
        userBadge.textContent = `👤 ${t('userLoggedAs')} ${displayName}`;
      } else {
        userBadge.textContent = `🌐 ${t('userPreviewMode')}`;
      }
    }

    // Google Maps Autocomplete (Places API New)
    function loadGoogleMapsAutocomplete() {
      if (!GOOGLE_MAPS_API_KEY) return;
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&v=weekly&callback=initAutocomplete`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    window.initAutocomplete = async function () {
      const addressInput = document.getElementById('address');
      const mapUrlInput = document.getElementById('mapUrl');
      const mapStatus = document.getElementById('mapStatus');
      const venueNameInput = document.getElementById('venueName');

      const { AutocompleteSuggestion, AutocompleteSessionToken } = await google.maps.importLibrary("places");

      const dropdown = document.createElement('div');
      dropdown.className = 'pac-container';
      dropdown.style.display = 'none';
      dropdown.style.position = 'relative';
      addressInput.parentNode.insertBefore(dropdown, addressInput.nextSibling);

      let sessionToken = new AutocompleteSessionToken();
      let debounceTimer = null;

      addressInput.addEventListener('input', () => {
        mapStatus.style.display = 'none';
        clearTimeout(debounceTimer);

        const query = addressInput.value.trim();
        if (query.length < 3) {
          dropdown.style.display = 'none';
          return;
        }

        debounceTimer = setTimeout(async () => {
          try {
            const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
              input: query,
              sessionToken: sessionToken,
              language: currentLang
            });

            dropdown.innerHTML = '';
            if (!suggestions || suggestions.length === 0) {
              dropdown.style.display = 'none';
              return;
            }

            suggestions.forEach((suggestion) => {
              const prediction = suggestion.placePrediction;
              if (!prediction) return;

              const item = document.createElement('div');
              item.className = 'pac-item';
              item.textContent = prediction.text.toString();

              item.addEventListener('click', async () => {
                dropdown.style.display = 'none';
                const place = prediction.toPlace();
                await place.fetchFields({ fields: ['formattedAddress', 'googleMapsURI', 'displayName'] });

                if (place.formattedAddress) {
                  addressInput.value = place.formattedAddress;
                }
                if (place.googleMapsURI) {
                  mapUrlInput.value = place.googleMapsURI;
                }
                if (!venueNameInput.value.trim() && place.displayName && !place.formattedAddress?.startsWith(place.displayName)) {
                  venueNameInput.value = place.displayName;
                }

                sessionToken = new AutocompleteSessionToken();
                mapStatus.style.display = 'inline-block';
                updatePreview();
              });

              dropdown.appendChild(item);
            });

            dropdown.style.display = 'block';
          } catch (err) {
            console.error('Places API error:', err);
          }
        }, 300);
      });

      document.addEventListener('click', (e) => {
        if (!addressInput.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
    };
    loadGoogleMapsAutocomplete();

    // =========================================================
    // УПРАВЛЕНИЕ НЕСКОЛЬКИМИ ДАТАМИ / СЕАНСАМИ
    // =========================================================
    const sessionsContainer = document.getElementById('sessionsContainer');
    const addSessionBtn = document.getElementById('addSessionBtn');

    function createSessionBlock(index) {
      const div = document.createElement('div');
      div.className = 'session-card';
      div.innerHTML = `
        <div class="session-header">
          <span class="session-label"><span data-i18n="sessionCardLabel">${t('sessionCardLabel')}</span> #${index + 1}</span>
          ${index > 0 ? `<button type="button" class="remove-session-btn" data-i18n="removeBtn">${t('removeBtn')}</button>` : ''}
        </div>
        <div class="form-group" style="margin-bottom: 10px;">
          <label><span data-i18n="dateLabel">${t('dateLabel')}</span> <span class="required">*</span></label>
          <input type="date" class="s-date" required>
        </div>
        <div class="row">
          <div class="form-group" style="margin-bottom: 0;">
            <label><span data-i18n="startTimeLabel">${t('startTimeLabel')}</span> <span class="required">*</span></label>
            <input type="time" class="s-start" required>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label data-i18n="endTimeLabel">${t('endTimeLabel')}</label>
            <input type="time" class="s-end">
          </div>
        </div>
      `;

      div.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', updatePreview);
        inp.addEventListener('change', updatePreview);
      });

      const removeBtn = div.querySelector('.remove-session-btn');
      if (removeBtn) {
        removeBtn.addEventListener('click', () => {
          div.remove();
          renumberSessions();
          updatePreview();
        });
      }

      return div;
    }

    function renumberSessions() {
      document.querySelectorAll('.session-card').forEach((card, idx) => {
        card.querySelector('.session-label').innerHTML = `<span data-i18n="sessionCardLabel">${t('sessionCardLabel')}</span> #${idx + 1}`;
      });
    }

    addSessionBtn.addEventListener('click', () => {
      const count = document.querySelectorAll('.session-card').length;
      if (count >= 10) {
        alert(t('alertMaxSessions'));
        return;
      }
      sessionsContainer.appendChild(createSessionBlock(count));
      updatePreview();
    });

    sessionsContainer.appendChild(createSessionBlock(0));

    // =========================================================
    // ЛОГИКА РАДИО-КНОПОК УСЛОВИЙ ВХОДА И ЧЕК-БОКСА "НА ВХОДЕ"
    // =========================================================
    const entryTypeRadios = document.querySelectorAll('input[name="entryType"]');
    const priceInput = document.getElementById('price');
    const atDoorCheckbox = document.getElementById('atDoor');
    const ticketSellerInput = document.getElementById('ticketSeller');
    const ticketUrlInput = document.getElementById('ticketUrl');

    const allFreeValues = availableLangs.map(l => TRANSLATIONS[l].entryFree);

    function getSelectedEntryType() {
      const checked = document.querySelector('input[name="entryType"]:checked');
      return checked ? checked.value : 'ticket';
    }

    function applyEntryTypeState() {
      const mode = getSelectedEntryType();

      if (mode === 'free') {
        priceInput.value = t('entryFree');
        priceInput.disabled = true;
        priceInput.required = false;

        atDoorCheckbox.checked = false;
        atDoorCheckbox.disabled = true;

        ticketSellerInput.value = '';
        ticketSellerInput.disabled = true;

        ticketUrlInput.value = '';
        ticketUrlInput.disabled = true;
      } else if (mode === 'donation') {
        if (allFreeValues.includes(priceInput.value)) {
          priceInput.value = '';
        }
        priceInput.disabled = false;
        priceInput.required = false;
        priceInput.placeholder = t('pricePlaceholderDonation');

        atDoorCheckbox.checked = false;
        atDoorCheckbox.disabled = true;

        ticketSellerInput.value = '';
        ticketSellerInput.disabled = true;

        ticketUrlInput.value = '';
        ticketUrlInput.disabled = true;
      } else {
        if (allFreeValues.includes(priceInput.value)) {
          priceInput.value = '';
        }
        priceInput.disabled = false;
        priceInput.required = true;
        priceInput.placeholder = t('pricePlaceholderTicket');

        atDoorCheckbox.disabled = false;
        if (atDoorCheckbox.checked) {
          ticketSellerInput.value = t('atDoorPostValue');
          ticketSellerInput.disabled = true;
          ticketUrlInput.disabled = true;
        } else {
          ticketSellerInput.disabled = false;
          ticketUrlInput.disabled = false;
        }
      }
      updatePreview();
    }

    entryTypeRadios.forEach(radio => {
      radio.addEventListener('change', applyEntryTypeState);
    });

    atDoorCheckbox.addEventListener('change', () => {
      if (atDoorCheckbox.checked) {
        ticketSellerInput.value = t('atDoorPostValue');
        ticketSellerInput.disabled = true;
        ticketUrlInput.value = '';
        ticketUrlInput.disabled = true;
      } else {
        ticketSellerInput.value = '';
        ticketSellerInput.disabled = false;
        ticketUrlInput.disabled = false;
      }
      updatePreview();
    });

    function getSessionsData() {
      const cards = document.querySelectorAll('.session-card');
      return Array.from(cards).map(card => ({
        date: card.querySelector('.s-date').value,
        startTime: card.querySelector('.s-start').value,
        endTime: card.querySelector('.s-end').value
      }));
    }

    function formatSessionsLines(sessions) {
      const dict = getDict();
      const grouped = [];

      sessions.forEach(s => {
        const timeStr = s.startTime || t('phTime');
        const range = (s.startTime && s.endTime) ? `${s.startTime}-${s.endTime}` : timeStr;

        if (!s.date) {
          grouped.push({ key: 'empty_' + Math.random(), dateLabel: t('phDate'), times: [range] });
          return;
        }

        const existing = grouped.find(g => g.key === s.date);
        if (existing) {
          existing.times.push(range);
        } else {
          const [year, month, day] = s.date.split('-').map(Number);
          const d = new Date(year, month - 1, day);
          const dayName = dict.days[d.getDay()];
          const monthName = dict.months[month - 1];
          const dateLabel = dict.formatDate
            ? dict.formatDate(dayName, day, monthName)
            : `${dayName}, ${day} ${monthName}`;
          grouped.push({ key: s.date, dateLabel, times: [range] });
        }
      });

      return grouped.map(g => `<b><i>◷ ${g.dateLabel}, ${g.times.join(', ')}</i></b>`).join('\n');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // =========================================================
    // ЗАГРУЗКА ОДНОЙ АФИШИ (КАРТИНКИ)
    // =========================================================
    const mediaInput = document.getElementById('mediaInput');
    const previewList = document.getElementById('previewList');
    let attachedFiles = [];
    let isSubmitting = false;
    let isOverLimit = false;

    mediaInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert(t('alertOnlyImage'));
        mediaInput.value = '';
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        alert(t('alertMaxSize'));
        mediaInput.value = '';
        return;
      }

      const base64 = await fileToBase64(file);
      attachedFiles = [{
        name: file.name,
        type: file.type,
        size: file.size,
        base64: base64.split(',')[1]
      }];

      mediaInput.value = '';
      renderFileList();
      updatePreview();
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderFileList() {
      previewList.innerHTML = '';
      attachedFiles.forEach((file) => {
        const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `
          <span>🖼 ${escapeHtml(file.name)} (${sizeMB} MB)</span>
          <button type="button" class="remove-file" onclick="removeFile()">${t('removeBtn')}</button>
        `;
        previewList.appendChild(item);
      });
    }

    window.removeFile = () => {
      attachedFiles = [];
      renderFileList();
      updatePreview();
    };

    // =========================================================
    // ЖИВОЙ ПРЕДПРОСМОТР И ПРОВЕРКА ЛИМИТА 4096 СИМВОЛОВ
    // =========================================================
    const submitBtn = document.getElementById('submitBtn');
    const MAX_POST_LENGTH = 4096;

    function computeFormattedPrice() {
      const mode = getSelectedEntryType();
      const rawPrice = priceInput.value.trim();

      if (mode === 'free') {
        return t('entryFree');
      }
      if (mode === 'donation') {
        return rawPrice ? `${t('entryDonation')} (${rawPrice})` : t('entryDonation');
      }
      return rawPrice || t('phPrice');
    }

    function getSelectedLinkTypeText() {
      const select = document.getElementById('eventLinkType');
      const opt = select.options[select.selectedIndex];
      return opt ? opt.textContent : select.value;
    }

    function updatePreview() {
      const title = document.getElementById('title').value.trim() || t('phTitle');
      const sessionsLines = formatSessionsLines(getSessionsData());

      const venueName = document.getElementById('venueName').value.trim() || t('phVenue');
      const venueUrl = document.getElementById('venueUrl').value.trim();
      const rawAddress = document.getElementById('address').value.trim();
      const address = rawAddress || t('phAddress');
      const mapUrl = document.getElementById('mapUrl').value.trim();

      const mode = getSelectedEntryType();
      const isTicketMode = mode === 'ticket';
      const atDoor = isTicketMode && atDoorCheckbox.checked;
      const priceVal = computeFormattedPrice();
      const ticketSeller = isTicketMode ? (atDoor ? t('atDoorPostValue') : ticketSellerInput.value.trim()) : '';
      const ticketUrl = (isTicketMode && !atDoor) ? ticketUrlInput.value.trim() : '';

      const eventLinkType = getSelectedLinkTypeText();
      const eventUrl = document.getElementById('eventUrl').value.trim();
      const description = document.getElementById('description').value.trim() || t('phDesc');

      const venueHtml = venueUrl
        ? `<a href="${escapeHtml(venueUrl)}" target="_blank">${escapeHtml(venueName)}</a>`
        : escapeHtml(venueName);

      const effectiveMapUrl = mapUrl || (rawAddress ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(venueName + ' ' + rawAddress)}` : '');
      const addressHtml = effectiveMapUrl
        ? `<a href="${escapeHtml(effectiveMapUrl)}" target="_blank">${escapeHtml(address)}</a>`
        : escapeHtml(address);

      let priceHtml = escapeHtml(priceVal);
      if (ticketUrl && ticketSeller) {
        priceHtml = `<a href="${escapeHtml(ticketUrl)}" target="_blank">${escapeHtml(priceVal)}</a> (<a href="${escapeHtml(ticketUrl)}" target="_blank">${escapeHtml(ticketSeller)}</a>)`;
      } else if (ticketUrl) {
        priceHtml = `<a href="${escapeHtml(ticketUrl)}" target="_blank">${escapeHtml(priceVal)}</a>`;
      } else if (ticketSeller) {
        priceHtml = `${escapeHtml(priceVal)} (${escapeHtml(ticketSeller)})`;
      }

      const eventLinkBlock = eventUrl
        ? `\n<a href="${escapeHtml(eventUrl)}" target="_blank">${escapeHtml(eventLinkType)}</a>\n`
        : '\n';

      const htmlPost =
`<b>${escapeHtml(title)}</b>

${sessionsLines}
<b><i>⚲ ${venueHtml} (${addressHtml})</i></b>
<b><i>€ ${priceHtml}</i></b>
${eventLinkBlock}
${escapeHtml(description)}

____
${t('footerAddPost')}
${t('footerCalendar')}
${t('footerChannel')}`;

      const previewEl = document.getElementById('livePreview');
      previewEl.innerHTML = htmlPost;

      const plainLength = previewEl.innerText.length;
      const counterEl = document.getElementById('charCounter');
      const countTextEl = document.getElementById('charCountText');
      const alertEl = document.getElementById('limitAlert');

      countTextEl.textContent = t('charCountFormat', { current: plainLength, max: MAX_POST_LENGTH });

      if (plainLength > MAX_POST_LENGTH) {
        const excess = plainLength - MAX_POST_LENGTH;
        isOverLimit = true;

        previewEl.classList.add('over-limit');
        counterEl.classList.add('over-limit');
        alertEl.style.display = 'block';
        alertEl.textContent = t('limitExceeded', { excess: excess, max: MAX_POST_LENGTH });

        if (!isSubmitting) {
          submitBtn.disabled = true;
        }
      } else {
        isOverLimit = false;

        previewEl.classList.remove('over-limit');
        counterEl.classList.remove('over-limit');
        alertEl.style.display = 'none';

        if (!isSubmitting) {
          submitBtn.disabled = false;
        }
      }
    }

    document.querySelectorAll('#eventForm input, #eventForm select, #eventForm textarea').forEach(el => {
      el.addEventListener('input', updatePreview);
      el.addEventListener('change', updatePreview);
    });

    setLanguage(currentLang);

    // Отправка формы
    const form = document.getElementById('eventForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (isOverLimit) {
        document.getElementById('limitAlert').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.textContent = t('submittingBtn');

      const mode = getSelectedEntryType();
      const isTicketMode = mode === 'ticket';
      const atDoor = isTicketMode && atDoorCheckbox.checked;

      const payload = {
        lang: currentLang,
        organizer: tgUser ? {
          id: tgUser.id,
          username: tgUser.username || '',
          firstName: tgUser.first_name || '',
          lastName: tgUser.last_name || ''
        } : null,
        moderatorNote: document.getElementById('moderatorNote').value.trim(),
        title: document.getElementById('title').value.trim(),
        sessions: getSessionsData(),
        entryType: mode,
        isFree: mode === 'free',
        atDoor: atDoor,
        price: computeFormattedPrice(),
        ticketSeller: isTicketMode ? (atDoor ? t('atDoorPostValue') : ticketSellerInput.value.trim()) : '',
        ticketUrl: (isTicketMode && !atDoor) ? ticketUrlInput.value.trim() : '',
        venueName: document.getElementById('venueName').value.trim(),
        venueUrl: document.getElementById('venueUrl').value.trim(),
        address: document.getElementById('address').value.trim(),
        mapUrl: document.getElementById('mapUrl').value.trim(),
        eventLinkType: getSelectedLinkTypeText(),
        eventUrl: document.getElementById('eventUrl').value.trim(),
        description: document.getElementById('description').value.trim(),
        files: attachedFiles
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === 'ok') {
          showSuccess();
        } else {
          throw new Error(result.message || 'Error');
        }
      } catch (err) {
        alert('Error: ' + err.message);
        isSubmitting = false;
        submitBtn.disabled = isOverLimit;
        submitBtn.textContent = t('submitBtn');
      }
    });

    function showSuccess() {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    }

    function closeApp() {
      if (tg.initData) {
        tg.close();
      } else {
        location.reload();
      }
    }
  </script>
</body>
</html>
