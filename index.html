<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title data-i18n="pageTitle"></title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="translations.js"></script>
  <script src="emojis.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f3f4f6);
      --text-color: var(--tg-theme-text-color, #111827);
      --hint-color: var(--tg-theme-hint-color, #6b7280);
      --link-color: var(--tg-theme-link-color, #2481cc);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: rgba(128, 128, 128, 0.22);
      --danger-color: #ef4444;
      --success-color: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 48px;
      line-height: 1.45;
      font-size: 15px;
    }

    .header {
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }

    .lang-switcher {
      display: inline-flex;
      background-color: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 2px;
      flex-shrink: 0;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--hint-color);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .lang-btn.active {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    .header p {
      font-size: 14px;
      color: var(--hint-color);
    }

    .header p a {
      color: var(--link-color);
      text-decoration: underline;
    }

    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 12px;
      background-color: var(--secondary-bg);
      border-radius: 8px;
      font-size: 13px;
      color: var(--hint-color);
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--hint-color);
      margin: 24px 0 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .required {
      color: var(--danger-color);
    }

    input[type="text"],
    input[type="url"],
    input[type="date"],
    input[type="time"],
    select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      border-color: var(--button-color);
    }

    input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .input-error {
      border-color: var(--danger-color) !important;
    }

    .field-error-msg {
      color: var(--danger-color);
      font-size: 12.5px;
      font-weight: 500;
      margin-top: 6px;
    }

    /* =========================================================
       МИКРО-РЕДАКТОР ОПИСАНИЯ
       ========================================================= */
    .rich-editor-wrapper {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--secondary-bg);
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .rich-editor-wrapper:focus-within {
      border-color: var(--button-color);
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-color);
    }

    .toolbar-btn {
      min-width: 30px;
      height: 30px;
      padding: 0 7px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--text-color);
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, color 0.15s;
      user-select: none;
    }

    .toolbar-btn:hover {
      background-color: var(--secondary-bg);
    }

    .toolbar-btn.active {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    .toolbar-divider {
      width: 1px;
      height: 18px;
      background-color: var(--border-color);
      margin: 0 3px;
    }

    .link-popover {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
    }

    .link-popover.open {
      display: flex;
    }

    .link-popover input[type="text"],
    .link-popover input[type="url"] {
      flex: 1;
      padding: 7px 10px;
      font-size: 13.5px;
      border-radius: 8px;
    }

    .link-popover-btn {
      padding: 7px 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .link-apply-btn {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    .link-remove-btn {
      background-color: rgba(239, 68, 68, 0.12);
      color: var(--danger-color);
    }

    .link-cancel-btn {
      background-color: var(--secondary-bg);
      color: var(--hint-color);
    }

    .emoji-popover {
      display: none;
      padding: 8px;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
    }

    .emoji-popover.open {
      display: block;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }

    .emoji-item-btn {
      height: 34px;
      border: none;
      border-radius: 8px;
      background: transparent;
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.12s, transform 0.1s;
      user-select: none;
    }

    .emoji-item-btn:hover {
      background-color: var(--secondary-bg);
    }

    .emoji-item-btn:active {
      transform: scale(0.92);
    }

    .rich-editor {
      min-height: 150px;
      max-height: 420px;
      overflow-y: auto;
      padding: 11px 12px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-color);
      outline: none;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .rich-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--hint-color);
      pointer-events: none;
    }

    .rich-editor a {
      color: var(--link-color);
      text-decoration: underline;
    }

    .rich-editor blockquote,
    .post-preview-box blockquote {
      border-left: 3px solid var(--button-color);
      padding: 4px 10px;
      margin: 6px 0;
      background-color: rgba(128, 128, 128, 0.08);
      border-radius: 0 6px 6px 0;
    }

    .rich-editor blockquote[expandable] {
      position: relative;
      padding-right: 26px;
      border-left-style: dashed;
    }

    .rich-editor blockquote[expandable]::after {
      content: "▾";
      position: absolute;
      right: 8px;
      bottom: 4px;
      font-size: 12px;
      color: var(--button-color);
      font-weight: 700;
    }

    .post-preview-box blockquote[expandable] {
      position: relative;
      padding-right: 26px;
      cursor: pointer;
    }

    .post-preview-box blockquote[expandable]::after {
      content: "▾";
      position: absolute;
      right: 8px;
      bottom: 4px;
      font-size: 12px;
      color: var(--button-color);
      font-weight: 700;
    }

    .post-preview-box blockquote[expandable].collapsed {
      max-height: 4.4em;
      overflow: hidden;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > .form-group {
      flex: 1;
    }

    .session-card {
      background-color: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      position: relative;
    }

    .session-card input {
      background-color: var(--bg-color);
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--hint-color);
    }

    .remove-session-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-session-btn {
      width: 100%;
      padding: 10px;
      border: 1px dashed var(--button-color);
      border-radius: 10px;
      background: transparent;
      color: var(--button-color);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .ticket-link-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .remove-ticket-link-btn {
      flex-shrink: 0;
      width: 36px;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: var(--secondary-bg);
      color: var(--danger-color);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .radio-group {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin-bottom: 10px;
    }

    .radio-group .checkbox-row {
      margin-bottom: 0;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      font-weight: 400;
    }

    .checkbox-row:has(input:disabled) {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .checkbox-row input[type="checkbox"],
    .checkbox-row input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--button-color);
      cursor: pointer;
    }

    .hint {
      font-size: 12px;
      color: var(--hint-color);
      margin-top: 5px;
    }

    .map-status {
      display: inline-block;
      font-size: 12px;
      color: var(--success-color);
      margin-top: 4px;
      font-weight: 500;
    }

    .pac-container {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-top: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      font-family: inherit;
      z-index: 9999;
    }
    .pac-item {
      padding: 8px 12px;
      color: var(--text-color);
      border-top: 1px solid var(--border-color);
      cursor: pointer;
      font-size: 13px;
    }
    .pac-item:hover {
      background-color: var(--secondary-bg);
    }
    .pac-item-query {
      color: var(--text-color);
      font-size: 14px;
    }

    .file-upload {
      position: relative;
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      background-color: var(--secondary-bg);
      cursor: pointer;
    }

    .file-upload input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-upload-text {
      font-size: 13px;
      color: var(--hint-color);
    }

    .file-upload-text strong {
      color: var(--button-color);
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .preview-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .preview-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: var(--secondary-bg);
      border-radius: 8px;
      font-size: 13px;
    }

    .preview-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 75%;
    }

    .remove-file {
      color: var(--danger-color);
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
    }

    .post-preview-box {
      background-color: var(--secondary-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      font-size: 13.5px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      transition: border-color 0.2s;
    }

    .post-preview-box.over-limit {
      border-color: var(--danger-color);
    }

    .post-preview-box a {
      color: var(--link-color);
      text-decoration: underline;
    }

    .char-counter {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 12.5px;
      color: var(--hint-color);
      margin-top: 8px;
    }

    .char-counter.over-limit {
      color: var(--danger-color);
      font-weight: 600;
    }

    .limit-alert {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: var(--danger-color);
      font-size: 13px;
      font-weight: 500;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background-color: var(--button-color);
      color: var(--button-text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .success-screen {
      display: none;
      text-align: center;
      padding: 48px 16px;
    }

    .success-icon {
      font-size: 52px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div id="formContainer">
    <div class="header">
      <div class="header-top">
        <h1 data-i18n="headerTitle"></h1>
        <div class="lang-switcher" id="langSwitcher"></div>
      </div>
      <p id="headerSubtitle"></p>
      <div class="user-badge" id="userBadge">👤 ...</div>
    </div>

    <form id="eventForm">
      <!-- БЛОК 1: ОСНОВНОЕ, ДАТЫ И БИЛЕТЫ -->
      <div class="section-title" data-i18n="sec1Title"></div>

      <div class="form-group">
        <label><span data-i18n="titleLabel"></span> <span class="required">*</span></label>
        <input type="text" id="title" data-i18n-placeholder="titlePlaceholder" required>
      </div>

      <label><span data-i18n="sessionsLabel"></span> <span class="required">*</span></label>
      <div id="sessionsContainer"></div>
      <button type="button" class="add-session-btn" id="addSessionBtn" data-i18n="addSessionBtn"></button>

      <div class="form-group">
        <label><span data-i18n="entryLabel"></span> <span class="required">*</span></label>
        <div class="radio-group">
          <label class="checkbox-row">
            <input type="radio" name="entryType" value="ticket" checked>
            <span data-i18n="entryTicket"></span>
          </label>
          <label class="checkbox-row">
            <input type="radio" name="entryType" value="free">
            <span data-i18n="entryFree"></span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="hasDonation">
            <span data-i18n="entryDonation"></span>
          </label>
        </div>
        <div id="priceInputWrap">
          <input type="text" id="price" data-i18n-placeholder="pricePlaceholderTicket" inputmode="decimal" required>
        </div>
      </div>

      <div class="form-group">
        <label data-i18n="ticketsSectionLabel"></label>
        <label class="checkbox-row">
          <input type="checkbox" id="atDoor">
          <span data-i18n="atDoorLabel"></span>
        </label>
      </div>

      <div class="form-group">
        <label data-i18n="ticketUrlLabel"></label>
        <div id="ticketLinksContainer"></div>
        <button type="button" class="add-session-btn" id="addTicketLinkBtn" style="margin-bottom: 0;" data-i18n="addTicketLinkBtn"></button>
      </div>

      <div class="form-group">
        <label data-i18n="ticketInfoLabel"></label>
        <input type="text" id="ticketInfo" data-i18n-placeholder="ticketInfoPlaceholder">
      </div>

      <!-- БЛОК 2: МЕСТО ПРОВЕДЕНИЯ -->
      <div class="section-title" data-i18n="sec2Title"></div>

      <div class="form-group">
        <label><span data-i18n="venueNameLabel"></span> <span class="required">*</span></label>
        <input type="text" id="venueName" data-i18n-placeholder="venueNamePlaceholder" required>
      </div>

      <div class="form-group">
        <label data-i18n="venueUrlLabel"></label>
        <input type="text" inputmode="url" id="venueUrl" placeholder="https://...">
      </div>

      <div class="form-group">
        <label data-i18n="addressLabel"></label>
        <input type="text" id="address" data-i18n-placeholder="addressPlaceholder" autocomplete="off">
        <div class="map-status" id="mapStatus" data-i18n="mapStatusSelected" style="display: none;"></div>
        <div class="hint" data-i18n="addressHint"></div>
      </div>

      <div class="form-group">
        <label data-i18n="mapUrlLabel"></label>
        <input type="text" inputmode="url" id="mapUrl" data-i18n-placeholder="mapUrlPlaceholder">
      </div>

      <!-- БЛОК 3: ОПИСАНИЕ И СОЦСЕТИ -->
      <div class="section-title" data-i18n="sec3Title"></div>

      <div class="row">
        <div class="form-group" style="flex: 1;">
          <label data-i18n="linkTypeLabel"></label>
          <select id="eventLinkType">
            <option value="✦ Facebook event">✦ Facebook event</option>
            <option value="✦ Instagram post">✦ Instagram post</option>
            <option value="✦ Сайт мероприятия" data-i18n="linkTypeSite"></option>
            <option value="✦ Регистрация" data-i18n="linkTypeReg"></option>
          </select>
        </div>
        <div class="form-group" style="flex: 1.6;">
          <label data-i18n="eventUrlLabel"></label>
          <input type="text" inputmode="url" id="eventUrl" placeholder="https://www.facebook.com/events/...">
        </div>
      </div>

      <div class="form-group">
        <label><span data-i18n="descLabel"></span> <span class="required">*</span></label>
        <div class="rich-editor-wrapper">
          <div class="editor-toolbar" id="editorToolbar">
            <button type="button" class="toolbar-btn" data-cmd="bold" data-i18n-title="edBold"><b>B</b></button>
            <button type="button" class="toolbar-btn" data-cmd="italic" data-i18n-title="edItalic"><i>I</i></button>
            <button type="button" class="toolbar-btn" data-cmd="underline" data-i18n-title="edUnderline"><u>U</u></button>
            <button type="button" class="toolbar-btn" data-cmd="strikeThrough" data-i18n-title="edStrike"><s>S</s></button>
            <span class="toolbar-divider"></span>
            <button type="button" class="toolbar-btn" id="btnLink" data-i18n-title="edLink">🔗</button>
            <button type="button" class="toolbar-btn" id="btnEmoji" title="Emoji">😊</button>
            <span class="toolbar-divider"></span>
            <button type="button" class="toolbar-btn" id="btnQuote" data-i18n-title="edQuote">❝</button>
            <button type="button" class="toolbar-btn" id="btnQuoteExp" data-i18n-title="edQuoteExp">❝▾</button>
            <span class="toolbar-divider"></span>
            <button type="button" class="toolbar-btn" id="btnClearFormat" data-i18n-title="edClear">✕</button>
          </div>
          <div class="link-popover" id="linkPopover">
            <input type="text" inputmode="url" id="linkUrlInput" placeholder="https://...">
            <button type="button" class="link-popover-btn link-apply-btn" id="linkApplyBtn" data-i18n="edLinkApply"></button>
            <button type="button" class="link-popover-btn link-remove-btn" id="linkRemoveBtn" data-i18n="edLinkRemove" style="display:none;"></button>
            <button type="button" class="link-popover-btn link-cancel-btn" id="linkCancelBtn">✕</button>
          </div>
          <div class="emoji-popover" id="emojiPopover">
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>
          <div id="descriptionEditor" class="rich-editor" contenteditable="true" data-i18n-placeholder="descPlaceholder"></div>
        </div>
        <div class="hint" data-i18n="descHint"></div>
      </div>

      <!-- БЛОК 4: АФИША И КОММЕНТАРИЙ -->
      <div class="section-title" data-i18n="sec4Title"></div>

      <div class="form-group">
        <label data-i18n="posterLabel"></label>
        <div class="file-upload">
          <input type="file" id="mediaInput" accept="image/*">
          <div class="file-upload-text">
            <strong data-i18n="uploadStrong"></strong>
            <span data-i18n="uploadHint"></span>
          </div>
        </div>
        <div class="preview-list" id="previewList"></div>
      </div>

      <div class="form-group">
        <label data-i18n="noteLabel"></label>
        <input type="text" id="moderatorNote" data-i18n-placeholder="notePlaceholder">
      </div>

      <!-- ПРЕДПРОСМОТР ПОСТА -->
      <div class="section-title" data-i18n="previewSectionTitle"></div>
      <div class="post-preview-box" id="livePreview"></div>
      <div class="char-counter" id="charCounter">
        <span id="charCountText"></span>
        <span data-i18n="charMaxHint"></span>
      </div>
      <div class="limit-alert" id="limitAlert"></div>

      <label class="checkbox-row" style="margin-top: 16px; align-items: flex-start;">
        <input type="checkbox" id="notifyConsent" checked style="margin-top: 2px; flex-shrink: 0;">
        <span data-i18n="notifyCheckboxLabel" style="font-size: 13.5px; line-height: 1.4;"></span>
      </label>

      <button type="submit" class="submit-btn" id="submitBtn" data-i18n="submitBtn"></button>
    </form>
  </div>

  <!-- ЭКРАН УСПЕШНОЙ ОТПРАВКИ -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">✅</div>
    <h2 data-i18n="successTitle"></h2>
    <p style="color: var(--hint-color); margin-top: 10px;" data-i18n="successText"></p>
    <p id="notifyStatusText" style="font-size: 13.5px; margin-top: 14px; padding: 10px 12px; border-radius: 10px; background-color: var(--secondary-bg);"></p>
    <a id="openBotLink" href="https://t.me/romanivanovevents_bot?start=notify" target="_blank" class="submit-btn" style="display: none; text-decoration: none; margin-top: 14px;" data-i18n="openBotBtn"></a>
    <button class="submit-btn" style="margin-top: 12px;" onclick="closeApp()" data-i18n="closeBtn"></button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let closingConfirmEnabled = false;
    function enableSafeClosing() {
      if (!closingConfirmEnabled && typeof tg.enableClosingConfirmation === 'function') {
        tg.enableClosingConfirmation();
        closingConfirmEnabled = true;
      }
    }
    document.getElementById('eventForm').addEventListener('input', enableSafeClosing, { once: true });

    // =========================================================
    // НАСТРОЙКИ
    // =========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySqviSBOlMPSlzF8N6Pra9Q1cQeI1TzFoRALCbNMHACICjjnRAVQoDNRJIIfPe8gWE/exec";
    const GOOGLE_MAPS_API_KEY = "AIzaSyArIrLC_kWYtfscg-_PI-pjsAWe2Uf2RhI";

    // =========================================================
    // СИСТЕМА ПЕРЕВОДОВ (TRANSLATIONS.JS)
    // =========================================================
    const availableLangs = Object.keys(TRANSLATIONS);
    let currentLang = detectInitialLanguage();

    function detectInitialLanguage() {
      const saved = localStorage.getItem('app_lang');
      if (saved && TRANSLATIONS[saved]) return saved;

      const tgLang = (tg.initDataUnsafe?.user?.language_code || '').toLowerCase().slice(0, 2);
      if (tgLang && TRANSLATIONS[tgLang]) return tgLang;

      return availableLangs[0] || 'ru';
    }

    function getDict() {
      return TRANSLATIONS[currentLang] || TRANSLATIONS[availableLangs[0]];
    }

    function t(key, vars = {}) {
      const dict = getDict();
      const fallback = TRANSLATIONS[availableLangs[0]] || {};
      let str = dict[key] !== undefined ? dict[key] : (fallback[key] !== undefined ? fallback[key] : key);
      if (typeof str === 'string') {
        Object.keys(vars).forEach(k => {
          str = str.replace(new RegExp(`\{${k}\}`, 'g'), vars[k]);
        });
      }
      return str;
    }

    function renderLangSwitcher() {
      const switcher = document.getElementById('langSwitcher');
      switcher.innerHTML = '';
      availableLangs.forEach(code => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lang-btn' + (code === currentLang ? ' active' : '');
        btn.textContent = TRANSLATIONS[code].langName || code.toUpperCase();
        btn.addEventListener('click', () => setLanguage(code));
        switcher.appendChild(btn);
      });
    }

    function setLanguage(lang) {
      if (!TRANSLATIONS[lang]) return;
      currentLang = lang;
      localStorage.setItem('app_lang', lang);
      document.documentElement.lang = lang;

      renderLangSwitcher();

      document.getElementById('headerSubtitle').innerHTML = t('headerSubtitle');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        const val = t(key);
        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
          el.placeholder = val;
        } else {
          el.setAttribute('data-placeholder', val);
        }
      });

      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        el.title = t(key);
      });

      updateUserBadge();
      applyEntryTypeState();
      renderFileList();
      updatePreview();
    }

    // Инициализация пользователя Telegram
    const tgUser = tg.initDataUnsafe?.user;
    function updateUserBadge() {
      const userBadge = document.getElementById('userBadge');
      if (tgUser) {
        const displayName = tgUser.username ? `@${tgUser.username}` : `${tgUser.first_name} (ID: ${tgUser.id})`;
        userBadge.textContent = `👤 ${t('userLoggedAs')} ${displayName}`;
      } else {
        userBadge.textContent = `🌐 ${t('userPreviewMode')}`;
      }
    }

    // =========================================================
    // ПРОВЕРКА И АВТОДОПОЛНЕНИЕ ССЫЛОК (HTTPS://)
    // =========================================================
    function parseAndNormalizeUrl(rawUrl) {
      let clean = String(rawUrl || '').trim();
      if (!clean) return { valid: true, url: '' };
      if (/\s/.test(clean)) return { valid: false, url: clean };

      if (!/^https?:\/\//i.test(clean)) {
        clean = 'https://' + clean;
      }

      try {
        const parsed = new URL(clean);
        const hostParts = parsed.hostname.split('.');
        const hasValidDomain = (parsed.protocol === 'http:' || parsed.protocol === 'https:')
          && hostParts.length >= 2
          && hostParts[hostParts.length - 1].length >= 2;

        return hasValidDomain ? { valid: true, url: clean } : { valid: false, url: clean };
      } catch (e) {
        return { valid: false, url: clean };
      }
    }

    function isValidHttpUrl(rawUrl) {
      return parseAndNormalizeUrl(rawUrl).valid;
    }

    function attachSmartUrlBehavior(inputEl) {
      inputEl.setAttribute('autocapitalize', 'off');
      inputEl.setAttribute('autocorrect', 'off');
      inputEl.setAttribute('spellcheck', 'false');

      const autoPrependProtocol = () => {
        const val = inputEl.value.trim();
        if (!val) return;
        const res = parseAndNormalizeUrl(val);
        if (res.valid && inputEl.value.trim() !== res.url) {
          inputEl.value = res.url;
          updatePreview();
        }
      };

      inputEl.addEventListener('blur', autoPrependProtocol);
      inputEl.addEventListener('paste', () => setTimeout(autoPrependProtocol, 0));
    }

    ['venueUrl', 'mapUrl', 'eventUrl', 'linkUrlInput'].forEach(id => {
      const el = document.getElementById(id);
      if (el) attachSmartUrlBehavior(el);
    });

    // Google Maps Autocomplete (Places API New)
    function loadGoogleMapsAutocomplete() {
      if (!GOOGLE_MAPS_API_KEY) return;
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&v=weekly&callback=initAutocomplete`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    }

    window.initAutocomplete = async function () {
      const addressInput = document.getElementById('address');
      const mapUrlInput = document.getElementById('mapUrl');
      const mapStatus = document.getElementById('mapStatus');
      const venueNameInput = document.getElementById('venueName');

      const { AutocompleteSuggestion, AutocompleteSessionToken } = await google.maps.importLibrary("places");

      const dropdown = document.createElement('div');
      dropdown.className = 'pac-container';
      dropdown.style.display = 'none';
      dropdown.style.position = 'relative';
      addressInput.parentNode.insertBefore(dropdown, addressInput.nextSibling);

      let sessionToken = new AutocompleteSessionToken();
      let debounceTimer = null;

      addressInput.addEventListener('input', () => {
        mapStatus.style.display = 'none';
        clearTimeout(debounceTimer);

        const query = addressInput.value.trim();
        if (query.length < 3) {
          dropdown.style.display = 'none';
          return;
        }

        debounceTimer = setTimeout(async () => {
          try {
            const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
              input: query,
              sessionToken: sessionToken,
              language: currentLang
            });

            dropdown.innerHTML = '';
            if (!suggestions || suggestions.length === 0) {
              dropdown.style.display = 'none';
              return;
            }

            suggestions.forEach((suggestion) => {
              const prediction = suggestion.placePrediction;
              if (!prediction) return;

              const item = document.createElement('div');
              item.className = 'pac-item';
              item.textContent = prediction.text.toString();

              item.addEventListener('click', async () => {
                dropdown.style.display = 'none';
                const place = prediction.toPlace();
                await place.fetchFields({ fields: ['formattedAddress', 'googleMapsURI', 'displayName'] });

                if (place.formattedAddress) {
                  addressInput.value = place.formattedAddress;
                }
                if (place.googleMapsURI) {
                  mapUrlInput.value = place.googleMapsURI;
                }
                if (!venueNameInput.value.trim() && place.displayName && !place.formattedAddress?.startsWith(place.displayName)) {
                  venueNameInput.value = place.displayName;
                }

                sessionToken = new AutocompleteSessionToken();
                mapStatus.style.display = 'inline-block';
                updatePreview();
              });

              dropdown.appendChild(item);
            });

            dropdown.style.display = 'block';
          } catch (err) {
            console.error('Places API error:', err);
          }
        }, 300);
      });

      document.addEventListener('click', (e) => {
        if (!addressInput.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.style.display = 'none';
        }
      });
    };
    loadGoogleMapsAutocomplete();

    // =========================================================
    // МИКРО-РЕДАКТОР, ПАНЕЛЬ ЭМОДЗИ И ВХОДЯЩИЙ HTML-ФИЛЬТР
    // =========================================================
    const editorEl = document.getElementById('descriptionEditor');
    const toolbarEl = document.getElementById('editorToolbar');
    const linkPopover = document.getElementById('linkPopover');
    const linkUrlInput = document.getElementById('linkUrlInput');
    const linkApplyBtn = document.getElementById('linkApplyBtn');
    const linkRemoveBtn = document.getElementById('linkRemoveBtn');
    const linkCancelBtn = document.getElementById('linkCancelBtn');
    const emojiPopover = document.getElementById('emojiPopover');
    const emojiGrid = document.getElementById('emojiGrid');
    const btnEmoji = document.getElementById('btnEmoji');
    let savedSelectionRange = null;
    let isComposing = false;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function escapeAttr(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Извлекает символ эмодзи из <img> / <tg-emoji> при копировании из Telegram, соцсетей и сайтов
    function extractEmojiFromNode(node) {
      const tag = node.tagName ? node.tagName.toLowerCase() : '';
      if (tag === 'tg-emoji') {
        const text = (node.textContent || '').trim();
        return text ? escapeHtml(text) : '';
      }
      if (tag === 'img') {
        const candidate = (
          node.getAttribute('alt') ||
          node.getAttribute('data-emoji') ||
          node.getAttribute('aria-label') ||
          ''
        ).trim();
        // Проверяем, что строка короткая и содержит символ эмодзи / пиктограмму (а не длинный alt-текст фото)
        if (candidate && candidate.length <= 16 && /[\p{Extended_Pictographic}\p{Emoji_Component}]/u.test(candidate)) {
          return escapeHtml(candidate);
        }
      }
      return '';
    }

    function sanitizeToTelegramHtml(rootNode, isPaste = false) {
      function walk(node, insideLink = false) {
        if (node.nodeType === Node.TEXT_NODE) {
          return escapeHtml(node.nodeValue);
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return '';
        }

        const tag = node.tagName.toLowerCase();
        if (tag === 'img' || tag === 'tg-emoji') {
          return extractEmojiFromNode(node);
        }
        if (['script', 'style', 'meta', 'link', 'svg', 'iframe', 'button', 'input'].includes(tag)) {
          return '';
        }
        if (tag === 'br') {
          return '
';
        }

        let isBold = (tag === 'b' || tag === 'strong');
        let isItalic = (tag === 'i' || tag === 'em');
        let isUnderline = (tag === 'u' || tag === 'ins');
        let isStrike = (tag === 's' || tag === 'strike' || tag === 'del');

        if (isPaste && node.style) {
          const fw = node.style.fontWeight;
          if (fw === 'bold' || fw === 'bolder' || (parseInt(fw, 10) >= 600)) isBold = true;
          if (node.style.fontStyle === 'italic') isItalic = true;
          const td = node.style.textDecoration || node.style.textDecorationLine || '';
          if (td.includes('underline') && tag !== 'a') isUnderline = true;
          if (td.includes('line-through')) isStrike = true;
        }

        let href = null;
        if (tag === 'a' && !insideLink) {
          const rawHref = (node.getAttribute('href') || '').trim();
          const parsedHref = parseAndNormalizeUrl(rawHref);
          if (parsedHref.valid && parsedHref.url) {
            href = parsedHref.url;
            isUnderline = false;
          }
        }

        if (tag === 'li') {
          let innerLi = '';
          node.childNodes.forEach(child => {
            innerLi += walk(child, insideLink || Boolean(href));
          });
          innerLi = innerLi.replace(/^
+|
+$/g, '');
          return innerLi ? `
• ${innerLi}
` : '';
        }

        let inner = '';
        node.childNodes.forEach(child => {
          inner += walk(child, insideLink || Boolean(href));
        });

        if (tag === 'blockquote') {
          const isExp = node.hasAttribute('expandable') || node.getAttribute('data-expandable') === 'true';
          const trimmed = inner.replace(/^
+|
+$/g, '');
          if (!trimmed) return '';
          return isExp
            ? `
<blockquote expandable>${trimmed}</blockquote>
`
            : `
<blockquote>${trimmed}</blockquote>
`;
        }

        if (!inner) return '';
        if (!inner.trim()) return inner;

        let res = inner;
        if (isBold) res = `<b>${res}</b>`;
        if (isItalic) res = `<i>${res}</i>`;
        if (isUnderline) res = `<u>${res}</u>`;
        if (isStrike) res = `<s>${res}</s>`;
        if (href) res = `<a href="${escapeAttr(href)}">${res}</a>`;

        if (['div', 'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'tr', 'section', 'article'].includes(tag)) {
          return `
${res}
`;
        }

        return res;
      }

      let raw = '';
      rootNode.childNodes.forEach(child => {
        raw += walk(child, false);
      });

      return raw
        .replace(/
/g, '
')
        .replace(/
{3,}/g, '

')
        .replace(/^
+|
+$/g, '');
    }

    function getDescriptionHtml() {
      return sanitizeToTelegramHtml(editorEl, false);
    }

    function getDescriptionPlainText() {
      return (editorEl.innerText || '').trim();
    }

    function saveSelection() {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (editorEl.contains(range.commonAncestorContainer)) {
          savedSelectionRange = range.cloneRange();
        }
      }
    }

    function restoreSelection() {
      if (!savedSelectionRange) return;
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedSelectionRange);
    }

    function findParentTag(node, tagName) {
      let curr = node && node.nodeType === Node.TEXT_NODE ? node.parentElement : node;
      while (curr && curr !== editorEl) {
        if (curr.tagName && curr.tagName.toLowerCase() === tagName.toLowerCase()) {
          return curr;
        }
        curr = curr.parentElement;
      }
      return null;
    }

    // Инициализация сетки эмодзи из файла emojis.js
    function initEmojiPicker() {
      const list = (typeof EVENT_EMOJIS !== 'undefined' && Array.isArray(EVENT_EMOJIS)) ? EVENT_EMOJIS : [];
      emojiGrid.innerHTML = '';

      list.forEach(emoji => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'emoji-item-btn';
        btn.textContent = emoji;
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          insertEmojiAtCursor(emoji);
        });
        emojiGrid.appendChild(btn);
      });
    }

    function insertEmojiAtCursor(emoji) {
      editorEl.focus();
      restoreSelection();

      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (editorEl.contains(range.commonAncestorContainer)) {
          range.deleteContents();
          const textNode = document.createTextNode(emoji);
          range.insertNode(textNode);
          range.setStartAfter(textNode);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
          saveSelection();
          enableSafeClosing();
          updatePreview();
          return;
        }
      }

      editorEl.appendChild(document.createTextNode(emoji));
      enableSafeClosing();
      updatePreview();
    }

    btnEmoji.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (emojiPopover.classList.contains('open')) {
        emojiPopover.classList.remove('open');
        btnEmoji.classList.remove('active');
      } else {
        saveSelection();
        linkPopover.classList.remove('open');
        emojiPopover.classList.add('open');
        btnEmoji.classList.add('active');
      }
    });

    initEmojiPicker();

    toolbarEl.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const cmd = btn.getAttribute('data-cmd');
        editorEl.focus();
        document.execCommand(cmd, false, null);
        updateToolbarState();
        updatePreview();
      });
    });

    document.getElementById('btnClearFormat').addEventListener('mousedown', (e) => {
      e.preventDefault();
      editorEl.focus();
      document.execCommand('removeFormat', false, null);
      document.execCommand('unlink', false, null);

      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const bq = findParentTag(sel.anchorNode, 'blockquote');
        if (bq) unwrapElement(bq);
      }
      updateToolbarState();
      updatePreview();
    });

    function unwrapElement(el) {
      const parent = el.parentNode;
      while (el.firstChild) {
        parent.insertBefore(el.firstChild, el);
      }
      parent.removeChild(el);
    }

    function toggleBlockquote(expandable) {
      editorEl.focus();
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;

      const existingBq = findParentTag(sel.anchorNode, 'blockquote');
      if (existingBq) {
        const isCurrentlyExp = existingBq.hasAttribute('expandable');
        if (isCurrentlyExp === expandable) {
          unwrapElement(existingBq);
        } else {
          if (expandable) {
            existingBq.setAttribute('expandable', '');
          } else {
            existingBq.removeAttribute('expandable');
          }
        }
        updateToolbarState();
        updatePreview();
        return;
      }

      const range = sel.getRangeAt(0);
      const bq = document.createElement('blockquote');
      if (expandable) bq.setAttribute('expandable', '');

      if (range.collapsed) {
        let block = range.startContainer;
        while (block && block !== editorEl && block.parentNode !== editorEl) {
          block = block.parentNode;
        }
        if (block && block !== editorEl && block.nodeType === Node.ELEMENT_NODE && ['DIV', 'P'].includes(block.tagName)) {
          while (block.firstChild) bq.appendChild(block.firstChild);
          block.parentNode.replaceChild(bq, block);
        } else {
          bq.innerHTML = '<br>';
          range.insertNode(bq);
          const newRange = document.createRange();
          newRange.setStart(bq, 0);
          newRange.collapse(true);
          sel.removeAllRanges();
          sel.addRange(newRange);
        }
      } else {
        const fragment = range.extractContents();
        bq.appendChild(fragment);
        range.insertNode(bq);
        sel.removeAllRanges();
      }

      updateToolbarState();
      updatePreview();
    }

    document.getElementById('btnQuote').addEventListener('mousedown', (e) => {
      e.preventDefault();
      toggleBlockquote(false);
    });

    document.getElementById('btnQuoteExp').addEventListener('mousedown', (e) => {
      e.preventDefault();
      toggleBlockquote(true);
    });

    function openLinkPopover() {
      saveSelection();
      emojiPopover.classList.remove('open');
      btnEmoji.classList.remove('active');

      const sel = window.getSelection();
      const existingLink = sel && sel.rangeCount > 0 ? findParentTag(sel.anchorNode, 'a') : null;

      if (existingLink) {
        linkUrlInput.value = existingLink.getAttribute('href') || '';
        linkRemoveBtn.style.display = 'inline-block';
      } else {
        linkUrlInput.value = '';
        linkRemoveBtn.style.display = 'none';
      }

      linkPopover.classList.add('open');
      setTimeout(() => {
        linkUrlInput.focus();
        linkUrlInput.select();
      }, 10);
    }

    function closeLinkPopover() {
      linkPopover.classList.remove('open');
      editorEl.focus();
      restoreSelection();
    }

    function applyLink() {
      const parsed = parseAndNormalizeUrl(linkUrlInput.value);
      if (!parsed.url) {
        closeLinkPopover();
        return;
      }
      if (!parsed.valid) {
        alert(t('edInvalidUrl'));
        return;
      }

      const url = parsed.url;
      linkPopover.classList.remove('open');
      editorEl.focus();
      restoreSelection();

      const sel = window.getSelection();
      const existingLink = sel && sel.rangeCount > 0 ? findParentTag(sel.anchorNode, 'a') : null;

      if (existingLink) {
        existingLink.setAttribute('href', url);
      } else if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (range.collapsed) {
          const a = document.createElement('a');
          a.href = url;
          a.textContent = url;
          range.insertNode(a);
          range.setStartAfter(a);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          document.execCommand('createLink', false, url);
        }
      }

      updateToolbarState();
      updatePreview();
    }

    document.getElementById('btnLink').addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (linkPopover.classList.contains('open')) {
        closeLinkPopover();
      } else {
        openLinkPopover();
      }
    });

    linkApplyBtn.addEventListener('click', applyLink);
    linkCancelBtn.addEventListener('click', closeLinkPopover);

    linkRemoveBtn.addEventListener('click', () => {
      linkPopover.classList.remove('open');
      editorEl.focus();
      restoreSelection();
      const sel = window.getSelection();
      const existingLink = sel && sel.rangeCount > 0 ? findParentTag(sel.anchorNode, 'a') : null;
      if (existingLink) {
        unwrapElement(existingLink);
      } else {
        document.execCommand('unlink', false, null);
      }
      updateToolbarState();
      updatePreview();
    });

    linkUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        applyLink();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeLinkPopover();
      }
    });

    editorEl.addEventListener('keydown', (e) => {

        const secondLevel = parts[parts.length - 2];
        if (['co', 'com', 'org', 'net', 'edu', 'gov'].includes(secondLevel) && parts.length >= 3) {

    function compressImageToJpeg(file, maxSide = 1280, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          URL.revokeObjectURL(objectUrl);

          let width = img.naturalWidth || img.width;
          let height = img.naturalHeight || img.height;

          if (width > maxSide || height > maxSide) {
            if (width >= height) {
              height = Math.round((height * maxSide) / width);
              width = maxSide;
            } else {
              width = Math.round((width * maxSide) / height);
              height = maxSide;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          const base64 = dataUrl.split(',')[1];
          const approxBytes = Math.round((base64.length * 3) / 4);

          resolve({ base64, size: approxBytes });
        };

        img.onerror = (err) => {
          URL.revokeObjectURL(objectUrl);
          reject(err);
        };

        img.src = objectUrl;
      });
    }

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === 'ok') {
          showSuccess(canNotify);
        } else {
          throw new Error(result.message || 'Error');
        }
      } catch (err) {
        alert('Error: ' + err.message);
        isSubmitting = false;
        submitBtn.disabled = isOverLimit;
        submitBtn.textContent = t('submitBtn');
      }
    });

    function showSuccess(canNotify) {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';

      const notifyTextEl = document.getElementById('notifyStatusText');
      const openBotLink = document.getElementById('openBotLink');

      if (canNotify) {
        notifyTextEl.textContent = t('notifyAllowed');
        openBotLink.style.display = 'none';
      } else {
        notifyTextEl.textContent = t('notifyDenied');
        openBotLink.style.display = 'block';
      }

      if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    }

    function closeApp() {
      if (tg.initData) {
        tg.close();
      } else {
        location.reload();
      }
    }
  </script>
</body>
</html>
